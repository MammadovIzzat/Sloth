# Sloth configuration. Every setting is optional.
# Restart after editing:  systemctl restart sloth

# Bind address. Leave on localhost unless you understand the consequences:
# this tool drives raw-socket scanners and stores engagement data.
#SLOTH_HOST=127.0.0.1
#SLOTH_PORT=9998

# Where results live. The packaged default is /var/lib/sloth.
#SLOTH_DATA=/var/lib/sloth

# Default masscan packet rate, and how long a login lasts.
#SLOTH_RATE=1000
#SLOTH_SESSION_HOURS=12

# Set when serving over TLS so the session cookie gets the Secure flag.
#SLOTH_HTTPS=1

# Signing key for session cookies. Generated automatically and stored under the
# data directory if unset; set it explicitly to keep sessions across reinstalls.
#SLOTH_SECRET=

# Never enable in production: the Flask debugger is a remote shell.
#SLOTH_DEBUG=0
