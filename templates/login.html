{% extends "base.html" %}
{% block title %}Sign in · Sloth{% endblock %}

{% block auth_content %}
<div style="display:flex; align-items:baseline; gap:9px">
    <h1 style="margin:0; font-family:var(--font-heading); font-size:21px; font-weight:500; letter-spacing:-.02em">Sign in</h1>
</div>
<p style="margin:7px 0 0; font-size:12.5px; line-height:1.7; color:rgba(233,233,237,.45)">Sign in to continue.</p>

<form method="post">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">
    <div class="authfields">
        <div class="authrow">
            <label for="lg-u">Username</label>
            <input id="lg-u" name="username" autocomplete="username" autofocus required>
        </div>
        <div class="authrow">
            <label for="lg-p">Password</label>
            <input id="lg-p" name="password" type="password" autocomplete="current-password" required>
            <button type="button" class="eye" data-eye="lg-p"><i class="ph ph-eye"></i></button>
        </div>
    </div>
    <button class="authcta" type="submit">Sign in</button>
</form>
{% endblock %}

{% block scripts %}
<script>
document.querySelectorAll("[data-eye]").forEach(function (b) {
    b.addEventListener("click", function () {
        var i = document.getElementById(b.dataset.eye);
        i.type = i.type === "password" ? "text" : "password";
        b.querySelector("i").className = i.type === "password" ? "ph ph-eye" : "ph ph-eye-slash";
    });
});
</script>
{% endblock %}
